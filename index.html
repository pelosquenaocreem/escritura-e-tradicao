<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritura & Tradição — Bíblia e Santo do Dia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Proza+Libre:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-parchment: #F6F1E5;
            --bg-card: #FCF8F2;
            --primary-burgundy: #6B1D2F;
            --primary-burgundy-hover: #521523;
            --accent-gold: #B8860B;
            --accent-gold-light: #DFBA62;
            --text-dark: #2A2421;
            --text-muted: #5C524B;
            --border-color: #E2D7C3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-parchment);
            color: var(--text-dark);
            font-family: 'Proza Libre', Georgia, serif;
            line-height: 1.8;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* NAVEGAÇÃO PRINCIPAL */
        .main-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            padding: 12px 25px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            color: var(--primary-burgundy);
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            border-color: var(--accent-gold);
        }

        .nav-btn.active {
            background: var(--primary-burgundy);
            color: #FFF;
            border-color: var(--primary-burgundy);
        }

        header {
            text-align: center;
            padding: 10px 0 20px;
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary-burgundy);
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* CONTROLES E SELETORES */
        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            background: var(--bg-card);
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .selector-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cinzel', serif;
            color: var(--primary-burgundy);
            font-weight: bold;
        }

        select, input[type="date"] {
            padding: 8px 12px;
            border: 1px solid var(--accent-gold-light);
            background: #FFF;
            font-family: 'Proza Libre', serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            border-radius: 4px;
            cursor: pointer;
        }

        .font-controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* CARTÕES DE CONTEÚDO */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            margin-bottom: 30px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            color: var(--primary-burgundy);
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .main-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            text-align: justify;
        }

        .main-text p { margin-bottom: 15px; }

        .verse-num {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary-burgundy);
            vertical-align: super;
            margin-right: 3px;
            font-family: 'Cinzel', serif;
        }

        /* TABS (ABAS) DO COMENTÁRIO E SANTO */
        .accordion-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .accordion-header {
            background: var(--primary-burgundy);
            color: #FFF;
            padding: 18px 25px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .accordion-content { padding: 25px; }

        .tabs-nav {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-dark);
            transition: all 0.2s;
            font-weight: bold;
        }

        .tab-btn:hover {
            border-color: var(--accent-gold);
            color: var(--primary-burgundy);
        }

        .tab-btn.active {
            background: var(--primary-burgundy);
            color: #FFF;
            border-color: var(--primary-burgundy);
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .secondary-text {
            font-size: 1.08rem;
            color: var(--text-dark);
            line-height: 1.9;
        }

        .secondary-text p { margin-bottom: 18px; text-align: justify; }

        .loading-text { text-align: center; font-style: italic; color: var(--text-muted); padding: 20px; }

        /* APP VIEWS */
        .app-view { display: none; }
        .app-view.active { display: block; }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- NAVEGAÇÃO ENTRE AS SEÇÕES DO SITE -->
        <nav class="main-nav">
            <button class="nav-btn active" id="btn-nav-escritura" onclick="switchApp('escritura')">📖 Sagrada Escritura</button>
            <button class="nav-btn" id="btn-nav-santo" onclick="switchApp('santo')">🕯️ Santo do Dia</button>
            <button class="nav-btn" id="btn-nav-evangelho" onclick="alert('Evangelho do Dia estará disponível em breve!');">🕊️ Evangelho do Dia</button>
        </nav>

        <header>
            <h1>ESCRITURA & TRADIÇÃO</h1>
            <div class="subtitle">O Pão da Palavra e a Vida dos Santos</div>
        </header>

        <div class="font-controls">
            <button class="tab-btn" onclick="mudarTamanhoLetra(1)">A+</button>
            <button class="tab-btn" onclick="mudarTamanhoLetra(-1)">A-</button>
        </div>

        <!-- ==============================================
             SEÇÃO 1: SAGRADA ESCRITURA
             ============================================== -->
        <div id="app-escritura" class="app-view active">
            <div class="controls-bar">
                <div class="selector-group">
                    <label for="book-select">LIVRO:</label>
                    <select id="book-select" onchange="updateChapterOptions()">
                        <option value="genesis">Gênesis</option>
                        <option value="mateus">Mateus</option>
                        <!-- Adicione os outros livros aqui como estava antes para economizar espaço -->
                    </select>
                </div>
                <div class="selector-group">
                    <label for="chapter-select">CAPÍTULO:</label>
                    <select id="chapter-select" onchange="fetchChapterFromSupabase()"></select>
                </div>
            </div>

            <main>
                <article class="content-card">
                    <h2 class="section-title" id="display-title">Carregando...</h2>
                    <div class="main-text" id="display-text">
                        <p class="loading-text">Selecione um livro e capítulo.</p>
                    </div>
                </article>

                <section class="accordion-section">
                    <div class="accordion-header">COMENTÁRIO & REFLEXÃO</div>
                    <div class="accordion-content">
                        <div class="tabs-nav">
                            <button class="tab-btn active" onclick="openTab(event, 'tab-comentario', 'escritura')">Teológico</button>
                            <button class="tab-btn" onclick="openTab(event, 'tab-reflexao', 'escritura')">Reflexão</button>
                        </div>
                        <div id="tab-comentario" class="tab-pane active escritura-tab">
                            <div class="secondary-text" id="text-comentario">Carregando...</div>
                        </div>
                        <div id="tab-reflexao" class="tab-pane escritura-tab">
                            <div class="secondary-text" id="text-reflexao">Carregando...</div>
                        </div>
                    </div>
                </section>
            </main>
        </div>


        <!-- ==============================================
             SEÇÃO 2: SANTO DO DIA
             ============================================== -->
        <div id="app-santo" class="app-view">
            <div class="controls-bar">
                <div class="selector-group">
                    <label for="date-santo">DATA DO SANTO:</label>
                    <input type="date" id="date-santo" onchange="fetchSantoFromSupabase()">
                </div>
                <button class="tab-btn" onclick="setTodaySanto()">Ir para Hoje</button>
            </div>

            <main>
                <article class="content-card">
                    <h2 class="section-title" id="santo-title">Carregando Santo...</h2>
                    <div class="main-text" id="santo-historia">
                        <p class="loading-text">Buscando a história do santo...</p>
                    </div>
                </article>

                <section class="accordion-section">
                    <div class="accordion-header">VIRTUDE & ORAÇÃO</div>
                    <div class="accordion-content">
                        <div class="tabs-nav">
                            <button class="tab-btn active" onclick="openTab(event, 'tab-virtude', 'santo')">Reflexão da Virtude</button>
                            <button class="tab-btn" onclick="openTab(event, 'tab-oracao', 'santo')">Oração Litúrgica</button>
                        </div>
                        <div id="tab-virtude" class="tab-pane active santo-tab">
                            <div class="secondary-text" id="santo-virtude">Carregando virtude...</div>
                        </div>
                        <div id="tab-oracao" class="tab-pane santo-tab">
                            <div class="secondary-text" id="santo-oracao">Carregando oração...</div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://mvjezxxrjgmxnfhjbxno.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12amV6eHhyamdteG5maGpieG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTQ3OTgsImV4cCI6MjEwODI3MDc5OH0.7Xdz_nLejoPJV-6pZHX6Q3DgtAu-_076M8WbG0CjFQ4';

        // -----------------------------------------
        // CONTROLE DE NAVEGAÇÃO PRINCIPAL
        // -----------------------------------------
        function switchApp(appName) {
            // Oculta todas as views
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            // Remove active dos botões principais
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            // Ativa o selecionado
            document.getElementById('app-' + appName).classList.add('active');
            document.getElementById('btn-nav-' + appName).classList.add('active');

            // Carrega o conteúdo inicial se necessário
            if (appName === 'santo' && document.getElementById('santo-title').textContent === 'Carregando Santo...') {
                setTodaySanto();
            }
        }

        // -----------------------------------------
        // FONTES E TABS GERAIS
        // -----------------------------------------
        let tamanhoFonteMain = 1.35;
        let tamanhoFonteSecundaria = 1.08;

        function mudarTamanhoLetra(direcao) {
            tamanhoFonteMain += direcao * 0.1;
            tamanhoFonteSecundaria += direcao * 0.1;
            
            document.querySelectorAll('.main-text').forEach(el => el.style.fontSize = tamanhoFonteMain + 'rem');
            document.querySelectorAll('.secondary-text').forEach(el => el.style.fontSize = tamanhoFonteSecundaria + 'rem');
        }

        function openTab(evt, tabId, context) {
            const panes = document.getElementsByClassName(context + '-tab');
            for (let i = 0; i < panes.length; i++) {
                panes[i].classList.remove('active');
            }
            
            const buttons = evt.currentTarget.parentElement.getElementsByClassName('tab-btn');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }


        // -----------------------------------------
        // LÓGICA DO SANTO DO DIA
        // -----------------------------------------
        function setTodaySanto() {
            const today = new Date();
            // Formata YYYY-MM-DD para o input
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            
            document.getElementById('date-santo').value = `${yyyy}-${mm}-${dd}`;
            fetchSantoFromSupabase();
        }

        async function fetchSantoFromSupabase() {
            const dateInput = document.getElementById('date-santo').value;
            if (!dateInput) return;

            // Extrai mês e dia da data selecionada
            const parts = dateInput.split('-'); // [Ano, Mes, Dia]
            const mes = parseInt(parts[1], 10);
            const dia = parseInt(parts[2], 10);

            document.getElementById('santo-title').textContent = 'Carregando...';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/santo_do_dia?mes=eq.${mes}&dia=eq.${dia}&select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });

                const data = await response.json();

                if (data && data.length > 0) {
                    const santo = data[0];
                    document.getElementById('santo-title').textContent = santo.nome_santo;
                    document.getElementById('santo-historia').innerHTML = santo.historia_completa;
                    document.getElementById('santo-virtude').innerHTML = santo.virtude_reflexao;
                    document.getElementById('santo-oracao').innerHTML = santo.oracao;
                } else {
                    document.getElementById('santo-title').textContent = `Dia ${dia}/${mes}`;
                    document.getElementById('santo-historia').innerHTML = '<p class="loading-text">A história deste santo ainda está sendo escrita pelo robô. Volte mais tarde!</p>';
                    document.getElementById('santo-virtude').innerHTML = '<p>Conteúdo em breve.</p>';
                    document.getElementById('santo-oracao').innerHTML = '<p>Conteúdo em breve.</p>';
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                document.getElementById('santo-title').textContent = 'Erro de Conexão';
            }
        }

        // =========================================
        // LÓGICA DA BÍBLIA (Simplificada para o Exemplo)
        // =========================================
        const bookChapters = { 'genesis': 50, 'mateus': 28 }; // Mantenha a sua lista inteira aqui!
        
        function updateChapterOptions() {
            const bookSelect = document.getElementById('book-select').value;
            const chapterSelect = document.getElementById('chapter-select');
            const totalChapters = bookChapters[bookSelect] || 1;

            chapterSelect.innerHTML = '';
            for (let i = 1; i <= totalChapters; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Capítulo ${i}`;
                chapterSelect.appendChild(opt);
            }
            fetchChapterFromSupabase();
        }

        async function fetchChapterFromSupabase() {
            // Lógica antiga de puxar a bíblia que já estava funcionando perfeitamente
        }

        window.onload = function() {
            updateChapterOptions();
        };
    </script>
</body>
</html>
