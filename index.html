<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritura & Tradição — Bíblia Católica Comentada</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Proza+Libre:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-parchment: #F6F1E5;
            --bg-card: #FCF8F2;
            --primary-burgundy: #6B1D2F;
            --primary-burgundy-hover: #521523;
            --accent-gold: #B8860B;
            --accent-gold-light: #DFBA62;
            --text-dark: #2A2421;
            --text-muted: #5C524B;
            --border-color: #E2D7C3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-parchment);
            color: var(--text-dark);
            font-family: 'Proza Libre', Georgia, serif;
            line-height: 1.8;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary-burgundy);
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .bible-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--bg-card);
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .selector-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cinzel', serif;
            color: var(--primary-burgundy);
            font-weight: bold;
        }

        select {
            padding: 8px 12px;
            border: 1px solid var(--accent-gold-light);
            background: #FFF;
            font-family: 'Proza Libre', serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            border-radius: 4px;
            cursor: pointer;
        }

        .bible-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            margin-bottom: 30px;
        }

        .chapter-title {
            font-family: 'Cinzel', serif;
            color: var(--primary-burgundy);
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .sacred-image-frame {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
            border: 1px solid var(--accent-gold-light);
            background: #FFF;
        }

        .sacred-image-frame img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            display: block;
            margin: 0 auto;
        }

        .image-caption {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .bible-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            text-align: justify;
        }

        .verse-num {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary-burgundy);
            vertical-align: super;
            margin-right: 3px;
            font-family: 'Cinzel', serif;
        }

        .accordion-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .accordion-header {
            background: var(--primary-burgundy);
            color: #FFF;
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .accordion-header:hover {
            background: var(--primary-burgundy-hover);
        }

        .accordion-content {
            padding: 25px;
            display: block;
        }

        .accordion-content.hidden {
            display: none;
        }

        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-dark);
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--accent-gold);
            color: var(--primary-burgundy);
        }

        .tab-btn.active {
            background: var(--primary-burgundy);
            color: #FFF;
            border-color: var(--primary-burgundy);
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .commentary-body {
            font-size: 1.05rem;
            color: var(--text-dark);
        }

        .commentary-body p {
            margin-bottom: 15px;
        }

        .quote-box {
            border-left: 3px solid var(--accent-gold);
            padding: 10px 15px;
            margin: 15px 0;
            font-style: italic;
            color: var(--text-muted);
            background: rgba(184, 134, 11, 0.05);
        }

        .loading-text {
            text-align: center;
            font-style: italic;
            color: var(--text-muted);
            padding: 20px;
        }

        @media (max-width: 600px) {
            .bible-selector {
                flex-direction: column;
            }
            .tabs-nav {
                flex-direction: column;
            }
            .tab-btn {
                width: 100%;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ESCRITURA & TRADIÇÃO</h1>
            <div class="subtitle">Leitura Sagrada à Luz do Magistério e da Tradição Católica</div>
        </header>

        <div class="bible-selector">
            <div class="selector-group">
                <label for="book-select">Livro:</label>
                <select id="book-select" onchange="fetchChapterFromSupabase()">
                    <option value="genesis">Gênesis</option>
                    <option value="exodo">Êxodo</option>
                    <option value="mateus">São Mateus</option>
                    <option value="joao">São João</option>
                </select>
            </div>
            <div class="selector-group">
                <label for="chapter-select">Capítulo:</label>
                <select id="chapter-select" onchange="fetchChapterFromSupabase()">
                    <option value="1">Capítulo 1</option>
                    <option value="2">Capítulo 2</option>
                </select>
            </div>
        </div>

        <main>
            <article class="bible-card">
                <h2 class="chapter-title" id="display-title">Carregando capítulo...</h2>
                
                <div class="sacred-image-frame" id="image-frame" style="display:none;">
                    <img id="display-image" src="" alt="Arte Sacra">
                    <div class="image-caption" id="display-caption"></div>
                </div>

                <div class="bible-text" id="display-text">
                    <p class="loading-text">Carregando texto do banco de dados...</p>
                </div>
            </article>

            <section class="accordion-section">
                <div class="accordion-header" onclick="toggleAccordion()">
                    <span>COMENTÁRIO TEOLÓGICO E EXEGÉTICO</span>
                    <span id="accordion-icon">▲</span>
                </div>

                <div class="accordion-content" id="accordion-content">
                    <div class="tabs-nav">
                        <button class="tab-btn active" onclick="openTab(event, 'tab-historico')">Contexto Histórico</button>
                        <button class="tab-btn" onclick="openTab(event, 'tab-vulgata')">Comentários da Vulgata</button>
                        <button class="tab-btn" onclick="openTab(event, 'tab-padres')">Santos Padres</button>
                        <button class="tab-btn" onclick="openTab(event, 'tab-catecismo')">Catecismo (CIC)</button>
                        <button class="tab-btn" onclick="openTab(event, 'tab-nt')">Novo Testamento</button>
                        <button class="tab-btn" onclick="openTab(event, 'tab-reflexao')">Reflexões para a Vida</button>
                    </div>

                    <div id="tab-historico" class="tab-pane active">
                        <div class="commentary-body" id="text-historico">Carregando...</div>
                    </div>

                    <div id="tab-vulgata" class="tab-pane">
                        <div class="commentary-body" id="text-vulgata">Carregando...</div>
                    </div>

                    <div id="tab-padres" class="tab-pane">
                        <div class="commentary-body" id="text-padres">Carregando...</div>
                    </div>

                    <div id="tab-catecismo" class="tab-pane">
                        <div class="commentary-body" id="text-catecismo">Carregando...</div>
                    </div>

                    <div id="tab-nt" class="tab-pane">
                        <div class="commentary-body" id="text-nt">Carregando...</div>
                    </div>

                    <div id="tab-reflexao" class="tab-pane">
                        <div class="commentary-body" id="text-reflexao">Carregando...</div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <script>
        // Configuração da API do Supabase
        const SUPABASE_URL = 'https://mvjezxxrjgmxnfhjbxno.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_I70LXUn1wwHmkEZkxtbMig_-nBbvb7O'; // Insira sua chave publishable aqui

        async function fetchChapterFromSupabase() {
            const book = document.getElementById('book-select').value;
            const chapter = document.getElementById('chapter-select').value;

            document.getElementById('display-title').textContent = 'Carregando...';
            document.getElementById('display-text').innerHTML = '<p class="loading-text">Carregando capítulo do banco de dados...</p>';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/capitulos?livro=eq.${book}&capitulo=eq.${chapter}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                const data = await response.json();

                if (data && data.length > 0) {
                    const cap = data[0];
                    document.getElementById('display-title').textContent = cap.titulo_capitulo;
                    document.getElementById('display-text').innerHTML = cap.texto_biblico;
                    
                    if (cap.imagem_url) {
                        document.getElementById('display-image').src = cap.imagem_url;
                        document.getElementById('display-caption').textContent = cap.imagem_legenda || '';
                        document.getElementById('image-frame').style.display = 'block';
                    } else {
                        document.getElementById('image-frame').style.display = 'none';
                    }

                    document.getElementById('text-historico').innerHTML = cap.contexto_historico;
                    document.getElementById('text-vulgata').innerHTML = cap.comentarios_vulgata;
                    document.getElementById('text-padres').innerHTML = cap.santos_padres;
                    document.getElementById('text-catecismo').innerHTML = cap.catecismo;
                    document.getElementById('text-nt').innerHTML = cap.novo_testamento;
                    document.getElementById('text-reflexao').innerHTML = cap.reflexoes_vida;
                } else {
                    document.getElementById('display-title').textContent = 'Capítulo não encontrado';
                    document.getElementById('display-text').innerHTML = '<p class="loading-text">Este capítulo ainda não foi adicionado ao banco de dados.</p>';
                }
            } catch (error) {
                console.error('Erro ao buscar dados:', error);
                document.getElementById('display-title').textContent = 'Erro ao carregar';
            }
        }

        function toggleAccordion() {
            const content = document.getElementById('accordion-content');
            const icon = document.getElementById('accordion-icon');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.textContent = '▲';
            } else {
                content.classList.add('hidden');
                icon.textContent = '▼';
            }
        }

        function openTab(evt, tabId) {
            const panes = document.getElementsByClassName('tab-pane');
            for (let i = 0; i < panes.length; i++) {
                panes[i].classList.remove('active');
            }

            const buttons = document.getElementsByClassName('tab-btn');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Carrega o capítulo inicial assim que a página abre
        window.onload = fetchChapterFromSupabase;
    </script>
</body>
</html>
